name: Deploy Blog

on:
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "templates/**"
      - "assets/**"
      - "_posts/**"
      - "pages/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TENCENT_SSH_KEY }}

      - name: Trust server host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ vars.TENCENT_SSH_PORT }}" "${{ secrets.TENCENT_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart on Tencent server
        run: |
          ssh -p "${{ vars.TENCENT_SSH_PORT }}" "${{ vars.TENCENT_DEPLOY_USER }}@${{ secrets.TENCENT_HOST }}" <<'EOF'
          set -eu
          cd "${{ vars.TENCENT_SITE_DIR }}"
          # Stash any local edits on the server (kept, not discarded) so
          # the checkout never aborts on conflicting working-tree changes.
          git stash push -u -m "deploy-autostash"
          # The server is a pure deploy checkout: align the branch exactly
          # to origin instead of pulling, so a diverged local branch (e.g.
          # stray commits from an older deploy script) cannot block deploys.
          # Server-local commits are printed here and stay recoverable via
          # the reflog; they are never silently dropped.
          git fetch origin
          echo "Server-local commits being left behind (recoverable via reflog):"
          git log --oneline origin/main..main
          git reset --hard origin/main
          docker compose pull
          # If the daemon is in a broken state (e.g. TTRPC/shim socket
          # corruption after unattended upgrades), restarting it once and
          # retrying is cheaper than a stuck deploy.
          if ! docker compose up -d --remove-orphans; then
            echo "docker compose up failed; restarting docker daemon and retrying once"
            sudo -n systemctl restart docker
            for i in $(seq 1 15); do
              docker info >/dev/null 2>&1 && break
              sleep 2
            done
            docker compose up -d --remove-orphans
          fi
          EOF
